providers:
  - name: gemini
    tier: free_primary
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    data_retention_posture: trains_on_input
    models:
      # gemini-2.5-flash is closed to API keys that never used it (404,
      # "no longer available to new users"). Google lists 3.8 Flash as current.
      - id: gemini-3.8-flash
        tool_calling: true
        enabled: true
    metadata:
      # Verify against Gemini's current limits page before relying on these
      # — free tiers are re-scoped without notice. These two figures were set
      # for gemini-2.5-flash and have not been checked for 3.8 Flash; Google
      # now shows free-tier limits per project in AI Studio, not in its docs.
      requests_per_minute: 15
      requests_per_day: 1000
